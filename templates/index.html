<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <style>
        body {
            background: linear-gradient(135deg, #1DA1F2, #0d0d0d, #14171A);
            background-size: 300% 300%;
            animation: gradientBG 6s infinite alternate;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .animated-title {
            font-size: 3rem;
            text-shadow: 0 0 10px #1DA1F2, 0 0 20px #1DA1F2;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #1DA1F2, 0 0 20px #1DA1F2; }
            to { text-shadow: 0 0 20px #00ffcc, 0 0 30px #00ffcc; }
        }
        .predict-btn {
            background: linear-gradient(90deg, #ffcc00, #ffaa00);
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d0d0d;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
            z-index: 2;
        }
        .predict-btn:hover {
            background: linear-gradient(90deg, #ffaa00, #ffcc00);
            transform: scale(1.1);
            transition: all 0.3s ease-in-out;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ffcc00; }
            50% { box-shadow: 0 0 20px #ffaa00; }
            100% { box-shadow: 0 0 10px #ffcc00; }
        }

        /* Floating Words Animation */
        .floating-words {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }
        .floating-words span {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0.3;
            color: rgba(255, 255, 255, 0.5);
            bottom: 0;
            animation: floatAnimation 8s linear infinite;
        }
        @keyframes floatAnimation {
            from {
                transform: translateY(0vh) rotate(0deg);
                opacity: 0;
            }
            to {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 1;
            }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const words = ["Positive", "Neutral", "Negative", "Happy", "Sad", "Excited", "Angry"];

            // Floating words effect
            const floatingWordsContainer = document.createElement("div");
            floatingWordsContainer.classList.add("floating-words");
            document.body.appendChild(floatingWordsContainer);

            function createFloatingWord() {
                const wordElement = document.createElement("span");
                wordElement.innerText = words[Math.floor(Math.random() * words.length)];
                wordElement.style.left = Math.random() * 100 + "vw";
                wordElement.style.animationDuration = (Math.random() * 5 + 5) + "s"; 
                floatingWordsContainer.appendChild(wordElement);

                // Remove word after animation
                setTimeout(() => wordElement.remove(), 8000);
            }
            setInterval(createFloatingWord, 1000);
        });
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="animated-title">Twitter Sentiment Analysis</h1>
            <p class="fade-in">Analyze Twitter sentiment in real time with AI-driven insights.</p>
        </header>
        <button class="predict-btn" onclick="window.location.href='/predict'">Predict Sentiment</button>
    </div>
</body>
</html>
