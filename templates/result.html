<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Result</title>
    <style>
        body {
            background-color: #0b74e4;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .result-container {
            text-align: center;
            font-size: 2rem;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: scale(0.8);
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .positive {
            color: #050000;
            text-shadow: 0 0 10px #00ff88;
        }

        .neutral {
            color: #aaaaaa;
            text-shadow: 0 0 10px #aaaaaa;
        }

        .negative {
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
        }
    </style>
</head>
<body>
    <div id="sentiment" class="result-container">Loading...</div>

    <script>
        // Simulating the API response
        const result = 1; // Replace with actual API response

        const sentimentDiv = document.getElementById("sentiment");

        if (result === 1) {
            sentimentDiv.innerText = "Positive 😊";
            sentimentDiv.classList.add("positive");
        } else if (result === 0) {
            sentimentDiv.innerText = "Neutral 😐";
            sentimentDiv.classList.add("neutral");
        } else if (result === -1) {
            sentimentDiv.innerText = "Negative 😞";
            sentimentDiv.classList.add("negative");
        }
    </script>
</body>
</html>
